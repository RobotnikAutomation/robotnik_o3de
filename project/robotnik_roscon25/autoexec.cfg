-- The benchmark selects the level per GameLauncher invocation through
-- /O3DE/Autoexec/ConsoleCommands/LoadLevel.  Do not add LoadLevel here:
-- multiple startup commands make O3DE chain through several worlds.

-- Keep simulation time at wall-clock scale. PhysX uses a fixed 20 ms step
-- from Registry/physxsystemconfiguration.setreg, so RTF cannot exceed 1.0x.
t_simulationTickScale=1.0
